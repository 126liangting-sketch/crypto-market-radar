name: BTC Market Radar Clean V1

concurrency:
  group: btc-market-radar-clean-v1
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run Clean V1 radar
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python market_radar.py

      - name: Save Clean V1 state and datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_state_clean_v1.json paper_trades_clean_v1.json paper_trades_clean_v1.csv blocked_setups_clean_v1.json blocked_setups_clean_v1.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Clean V1 radar state"
            git pull --rebase origin main
            git push origin main
          fi
