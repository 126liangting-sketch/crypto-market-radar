name: 雷射訊號｜Laser Signal 3.0

concurrency:
  group: laser-signal-3-0
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run Laser Signal 3.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python market_radar.py

      - name: Save Laser Signal 3.0 state and datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_state_v3.json paper_trades_v3.json paper_trades_v3.csv blocked_setups_v3.json blocked_setups_v3.csv prepare_validation_v3.json prepare_validation_v3.csv setup_lifecycle_v3.json setup_lifecycle_v3.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Laser Signal 3.0 state"
            git pull --rebase origin main

            pushed=0
            for attempt in 1 2 3; do
              if git push origin main; then
                pushed=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                wait_seconds=$((attempt * 10))
                echo "GitHub push failed (attempt $attempt/3); retrying in ${wait_seconds}s..."
                sleep "$wait_seconds"
                git pull --rebase origin main || true
              fi
            done

            if [ "$pushed" -ne 1 ]; then
              echo "GitHub push failed after 3 attempts."
              exit 1
            fi
          fi
