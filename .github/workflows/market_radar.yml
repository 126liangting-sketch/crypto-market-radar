name: Crypto Market Radar

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install requests

      - name: Run Radar
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

        run: |
          python market_radar.py

      - name: Save Probability Data
        run: |

          if [ -f probability_state.json ]; then

            git config user.name "github-actions[bot]"

            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add probability_state.json

            if git diff --cached --quiet; then

              echo "沒有新的統計資料"

            else

              git commit -m "Update probability data"

              git push

            fi

          fi
