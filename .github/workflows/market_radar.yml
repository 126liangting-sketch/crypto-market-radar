name: BTC Market Radar V7

concurrency:
  group: btc-market-radar-v7
  cancel-in-progress: false
  
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run V7 radar
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python market_radar.py

      - name: Save V7 state and datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_state_v7.json paper_trades_v7.json paper_trades_v7.csv prepare_trades_v7.json prepare_trades_v7.csv blocked_reasons_v7.json blocked_reasons_v7.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update V7 radar state"
            git pull --rebase origin main
            git push origin main
          fi
