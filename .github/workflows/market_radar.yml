name: BTC Market Radar V6.1

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run radar
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python market_radar.py

      - name: Save V6 state and datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add probability_state.json forward_test_v6.json forward_test_v6.csv blocked_reasons.json blocked_reasons.csv 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Update V6 radar state and datasets"
            git push
          fi
